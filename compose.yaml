services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: drivepoint
      POSTGRES_USER: drivepoint
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - drivepoint_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drivepoint -d drivepoint"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  drivepoint_pgdata:
